- name: Deploy WebLogic Operator and Domain (environment-aware)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    admin_secret_name: weblogic-admin-credentials
    operator_manifest_content: "{{ lookup('file', repo_root ~ '/' ~ operator_manifest, errors='ignore') }}"
    apply_operator_effective: "{{ (apply_operator | bool) and ((operator_manifest_content | regex_search('(?m)^\\s*apiVersion:')) is not none) }}"

  tasks:
    - name: Show selected deployment profile
      debug:
        msg:
          - "namespace={{ namespace }}"
          - "kustomize_overlay={{ kustomize_overlay }}"
          - "manage_namespace={{ manage_namespace }}"
          - "apply_operator={{ apply_operator }}"
          - "apply_operator_effective={{ apply_operator_effective }}"

    - name: Ensure target namespace exists when managed by this repo
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace }}"
      when: manage_namespace | bool

    - name: Create admin credentials Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ admin_secret_name }}"
            namespace: "{{ namespace }}"
          type: Opaque
          stringData:
            username: "{{ weblogic_admin_user }}"
            password: "{{ weblogic_admin_password }}"
      when: create_admin_secret | bool

    - name: Apply Operator manifest when managed by this repo
      command: kubectl apply -f "{{ operator_manifest }}"
      args:
        chdir: "{{ repo_root }}"
      register: apply_operator_result
      changed_when: "'configured' in apply_operator_result.stdout or 'created' in apply_operator_result.stdout or 'unchanged' not in apply_operator_result.stdout"
      when: apply_operator_effective | bool

    - name: Explain why operator application is skipped
      debug:
        msg: "Skipping operator apply because apply_operator=false or {{ operator_manifest }} still contains only the placeholder."
      when: not (apply_operator_effective | bool)

    - name: Pause briefly to let operator start
      pause:
        seconds: 5
      when: apply_operator_effective | bool

    - name: Apply selected Kustomize overlay
      command: kubectl apply -k "{{ kustomize_overlay }}"
      args:
        chdir: "{{ repo_root }}"
      register: apply_overlay
      changed_when: "'configured' in apply_overlay.stdout or 'created' in apply_overlay.stdout"

    - name: Wait for Admin Server pod to appear
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - 'weblogic.domainUID={{ domain_uid }}'
          - 'weblogic.serverName=admin-server'
      register: admin_pods
      retries: 20
      delay: 6
      until: admin_pods.resources | length > 0
      when: wait_for_admin | bool

    - name: Wait until Admin Server pod is Ready
      vars:
        admin_name: "{{ (admin_pods.resources | first).metadata.name }}"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        name: "{{ admin_name }}"
      register: admin_ready
      retries: 40
      delay: 10
      until: admin_ready.resources | length > 0 and (admin_ready.resources[0].status.conditions | selectattr('type','equalto','Ready') | selectattr('status','equalto','True') | list) | length > 0
      when: wait_for_admin | bool

    - name: Show deployed resources (namespace)
      command: kubectl get pods -n "{{ namespace }}" -o wide
      register: pods_out

    - name: Print pod list
      debug:
        msg: "{{ pods_out.stdout }}"

