---
# Global vars for weblogic deployment
namespace: weblogic

# Domain identity
domain_uid: sample-domain1
weblogic_admin_user: admin
weblogic_admin_password: ChangeMe123!   # change or store in Ansible Vault

# Image: replace with your WebLogic image (private registry or local)
weblogic_image: REPLACE_WITH_YOUR_WLS_IMAGE

# -----------------------------------------------------------------------------
# eip-ansible aligned WebLogic/common variable names
# -----------------------------------------------------------------------------
serviceuser: docker
servicegroup: docker

# Common install roots
install_location: /u01
wls_location: "{{ install_location }}/oracle"
domain_location: "{{ install_location }}/domains"
installer_location: "{{ install_location }}/_install"
SOFTWARE_REPO_PATH: "{{ installer_location }}/weblogic"

# WebLogic/domain naming compatibility
domain_name: sample-domain1
DOMAIN_NAME: "{{ domain_name }}"
BASEDIR: "{{ wls_location }}"
WLS_OS_USER: "{{ serviceuser }}"
ORACLE_HOME: "{{ wls_location }}"

# Installer/runtime defaults used by ansible/install_weblogic.yml
weblogic_installer_src: files/fmw_generic_installer.jar
weblogic_response_template: templates/response.rsp.j2
installer_workdir: /tmp/weblogic_installer
java_package_apt: openjdk-17-jdk
java_package_yum: java-17-openjdk-devel

# PV/PVC settings (dev: hostPath)
pv_host_path: /mnt/weblogic/pv-home
pv_storage: 5Gi
storage_class: manual

# Dev SSH profile for ephemeral minikube targets.
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

# Manifest paths (relative to repo)
operator_manifest: k8s/operator.yaml
domain_manifest: k8s/domain.yaml

# Environment-aware deployment defaults.
# Minikube remains the safe default; override with -e @group_vars/env_hosted.yml
# when targeting the shared/hosted cluster.
kustomize_overlay: k8s/overlays/minikube
manage_namespace: true
apply_operator: true
create_admin_secret: true
wait_for_admin: true


