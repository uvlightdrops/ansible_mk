apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wls-managed-2
spec:
  replicas: 1
  serviceName: wls-managed-2-headless
  selector:
    matchLabels:
      app: wls-managed-2
  template:
    metadata:
      labels:
        app: wls-managed-2
    spec:
      imagePullSecrets:
      - name: wls-image-secret
      volumes:
      - name: domain-home
        persistentVolumeClaim:
          claimName: pvc-weblogic-home

      containers:
      - name: wls-managed
        image: wls-dev:1.3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        # Keep the pod running for ansible/kubectl exec based operations.
        args: ["sleep", "infinity"]
        volumeMounts:
        - name: domain-home
          mountPath: /u01/domains

