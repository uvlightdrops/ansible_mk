apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../namespace.yaml
  - ../../pv.yaml
  - ../../pvc-weblogic-home.yaml
  - ../../services-clusterip.yaml
  - ../../deploy-test-db.yaml
  - deploy-wls-admin.yaml
  - deploy-wls-managed-1.yaml
  - deploy-wls-managed-2.yaml
  - deploy-wls-managed-3.yaml
patches:
  - path: patch-pvc-storageclass.yaml

# Image-Override: Sobald postgres:15 in Harbor liegt, hier eintragen.
# Kustomize ersetzt dann das Image in deploy-test-db.yaml automatisch.
# Beispiel:
#   images:
#     - name: postgres
#       newName: harbor.example.com/weblogic/postgres
#       newTag: "15"
#
# Aktuell: postgres:15 wird direkt von Docker Hub gezogen (nur für lokalen Dev!)
images: []

