apiVersion: v1
data:
  gen-ssh-keys.sh: |+
    #!/bin/sh
    set -xeu

    echo "=== gen-ssh-keys START ===" >&2
    date >&2

    # If image provides a backup of /etc/ssh, copy it into the (possibly empty) /etc/ssh
    if [ -d /etc/ssh.orig ] && [ -z "$(ls -A /etc/ssh 2>/dev/null)" ]; then
      echo "Restoring /etc/ssh from /etc/ssh.orig" >&2
      cp -av /etc/ssh.orig/* /etc/ssh || true
    fi

    # Ensure host keys exist (works if /etc/ssh is an emptyDir)
    echo "Generating host keys if missing" >&2
    ssh-keygen -A || true

    # Ensure .ssh exists (home is provided by the image) and authorized_keys file
    echo "Ensure /home/docker/.ssh and authorized_keys exist" >&2
    mkdir -p /home/docker/.ssh || true
    touch /home/docker/.ssh/authorized_keys || true

    # Install pubkeys from /pubkeys (ConfigMap) idempotently
    if [ -d /pubkeys ]; then
      echo "Scanning /pubkeys for public keys to install" >&2
      for f in /pubkeys/*.pub; do
        [ -f "$f" ] || continue
        echo "- checking $f" >&2
        if ! grep -Fxf "$f" /home/docker/.ssh/authorized_keys >/dev/null 2>&1; then
          cat "$f" >> /home/docker/.ssh/authorized_keys || true
          echo "  -> appended $f" >&2
        else
          echo "  -> already present: $f" >&2
        fi
      done
    fi

    # Best-effort: set ownership and permissions (InitContainer usually runs as root)
    if getent passwd docker >/dev/null 2>&1; then
      DOCKER_UID=$(getent passwd docker | cut -d: -f3)
      DOCKER_GID=$(getent passwd docker | cut -d: -f4)
      echo "Setting ownership to docker:${DOCKER_UID}:${DOCKER_GID}" >&2
      chown -R ${DOCKER_UID}:${DOCKER_GID} /home/docker || true
    else
      echo "User 'docker' missing in image; fallback chown to 1000:1000" >&2
      chown -R 1000:1000 /home/docker || true
    fi
    chmod 755 /home/docker || true
    chmod 700 /home/docker/.ssh || true
    chmod 600 /home/docker/.ssh/authorized_keys || true

    echo "=== gen-ssh-keys END ===" >&2
    date >&2

kind: ConfigMap
metadata:
  name: gen-ssh-keys-script
