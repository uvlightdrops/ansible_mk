apiVersion: v1
data:
  gen-ssh-keys.sh: |+
    #!/bin/sh
    set -xeu
    # Debuggable init script for generating SSH host keys and preparing /home/docker
    echo "=== gen-ssh-keys START ===" >&2
    date >&2

    echo "Environment:" >&2
    env | grep -E 'HOME|USER|PATH' >&2 || true

    # If image contains a backup of /etc/ssh (from build), copy it to the mounted volume
    if [ -d /etc/ssh.orig ] && [ -z "$(ls -A /etc/ssh 2>/dev/null)" ]; then
      echo "Copying /etc/ssh.orig -> /etc/ssh" >&2
      cp -av /etc/ssh.orig/* /etc/ssh || true
    fi

    # Ensure minimal sshd_config exists if nothing was copied
    if [ ! -f /etc/ssh/sshd_config ]; then
      echo "Creating minimal sshd_config" >&2
      cat > /etc/ssh/sshd_config <<'EOF'
    Port 22
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ecdsa_key
    HostKey /etc/ssh/ssh_host_ed25519_key
    SyslogFacility AUTH
    PermitRootLogin no
    PasswordAuthentication no
    ChallengeResponseAuthentication no
    UsePAM yes
    EOF
    fi

    echo "Running ssh-keygen -A" >&2
    ssh-keygen -A || true

    echo "Fix ownership/permissions for /etc/ssh" >&2
    chown -R 1000:1000 /etc/ssh || true
    find /etc/ssh -type f -exec chmod 600 {} \; || true

    # ensure docker home exists and is writable by uid 1000
    echo "Ensure /home/docker and .ssh exist" >&2
    mkdir -p /home/docker/.ssh || true
    touch /home/docker/.ssh/authorized_keys || true
    # If a 'docker' user exists in the image, use its numeric UID:GID for ownership;
    # otherwise fall back to 1000:1000 as before.
    if getent passwd docker >/dev/null 2>&1; then
      DOCKER_UID=$(getent passwd docker | cut -d: -f3)
      DOCKER_GID=$(getent passwd docker | cut -d: -f4)
      echo "Setting ownership to docker:$DOCKER_UID:$DOCKER_GID" >&2
      chown -R ${DOCKER_UID}:${DOCKER_GID} /home/docker || true
    else
      echo "User 'docker' not found; falling back to uid:gid 1000:1000" >&2
      chown -R 1000:1000 /home/docker || true
    fi
    chmod 700 /home/docker/.ssh || true
    chmod 600 /home/docker/.ssh/authorized_keys || true

    # If a ConfigMap with public keys is mounted at /pubkeys, append any keys there
    if [ -d /pubkeys ]; then
      echo "Checking /pubkeys for public keys to install" >&2
      for k in /pubkeys/*; do
        if [ -f "$k" ]; then
          echo "- processing pubkey: $k" >&2
          # append if not already present
          if ! grep -qxFf "$k" /home/docker/.ssh/authorized_keys 2>/dev/null; then
            cat "$k" >> /home/docker/.ssh/authorized_keys || true
            echo "  -> appended $k" >&2
          else
            echo "  -> already present: $k" >&2
          fi
        fi
      done
      # enforce perms again
      chown -R 1000:1000 /home/docker || true
      chmod 700 /home/docker/.ssh || true
      chmod 600 /home/docker/.ssh/authorized_keys || true
    fi

    echo "=== gen-ssh-keys END ===" >&2
    date >&2

kind: ConfigMap
metadata:
  name: gen-ssh-keys-script
  namespace: weblogic
