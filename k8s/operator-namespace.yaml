apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "weblogic-operator"
  namespace: "weblogic-operator"
  labels:
    weblogic.operatorName: "weblogic-operator"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      weblogic.operatorName: "weblogic-operator"
  replicas: 1
  template:
    metadata:
      annotations:
        prometheus.io/port: '8083'
        prometheus.io/scrape: 'true'
      labels:
        weblogic.operatorName: "weblogic-operator"
        app: "weblogic-operator"
    spec:
      serviceAccountName: "default"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: "weblogic-operator"
        image: "4.3.0-RELEASE-MARKER"
        imagePullPolicy: "IfNotPresent"
        command: ["/operator/operator.sh"]
        lifecycle:
          preStop:
            exec:
              command: ["/operator/stop.sh"]
        env:
        - name: "OPERATOR_NAMESPACE"
          valueFrom:
            fieldRef:
              fieldPath: "metadata.namespace"
        - name: "OPERATOR_POD_NAME"
          valueFrom:
            fieldRef:
              fieldPath: "metadata.name"
        - name: "OPERATOR_POD_UID"
          valueFrom:
            fieldRef:
              fieldPath: "metadata.uid"
        - name: "OPERATOR_VERBOSE"
          value: "false"
        - name: "JAVA_LOGGING_LEVEL"
          value: "INFO"
        - name: "JAVA_LOGGING_MAXSIZE"
          value: "20000000"
        - name: "JAVA_LOGGING_COUNT"
          value: "10"
        - name: "JVM_OPTIONS"
          value: "-XshowSettings:vm -XX:MaxRAMPercentage=70"
        - name: "OPERATOR_INTROSPECTJOB_RECHECK_SKEW"
          value: "3"
        - name: "OPERATOR_LOGDIR"
          value: "/logs"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: "weblogic-operator-cm-volume"
          mountPath: "/deployment/config"
        - name: "weblogic-operator-debug-cm-volume"
          mountPath: "/deployment/debug-config"
        - name: "weblogic-operator-secrets-volume"
          mountPath: "/deployment/secrets"
          readOnly: true
        - name: "deployment-volume"
          mountPath: "/deployment"
        - name: "tmp-volume"
          mountPath: "/tmp"
        - name: "log-volume"
          mountPath: "/logs"
        livenessProbe:
          exec:
            command: ["/operator/livenessProbe.sh"]
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command: ["/operator/readinessProbe.sh"]
          initialDelaySeconds: 2
          periodSeconds: 10
      volumes:
      - name: "weblogic-operator-cm-volume"
        configMap:
          name: "weblogic-operator-cm"
      - name: "weblogic-operator-debug-cm-volume"
        configMap:
          name: "weblogic-operator-debug-cm"
          optional: true
      - name: "weblogic-operator-secrets-volume"
        secret:
          secretName: "weblogic-operator-secrets"
      - name: "deployment-volume"
        emptyDir: {}
      - name: "tmp-volume"
        emptyDir: {}
      - name: "log-volume"
        emptyDir: {}
---
