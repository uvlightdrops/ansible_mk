[defaults]
# Root-level config so ansible-playbook from repo root picks safe SSH defaults.
inventory = inventory.yaml
# venv-lokale Collections (angelegt durch scripts/setup_venv.sh)
collections_path = .venv/collections
host_key_checking = False
retry_files_enabled = False
private_key_file = ~/.ssh/id_ed25519
timeout = 10

[ssh_connection]
# Dev profile: avoid stale known_hosts issues after rebuilds/teardowns.
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

